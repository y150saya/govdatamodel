<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <title>施設管理データ標準化スタジオ v2.0</title>
  <meta name="description" content="自治体施設管理データモデルの関連図探索・項目定義・統制語彙・CSVテンプレート出力を行う標準化ワークベンチ">
  <link rel="stylesheet" href="./style.css">
  <script defer src="./data/model-data.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <div class="studio-layout">
    <aside class="sidebar" aria-label="メインナビゲーション">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">FM</div>
        <div class="brand-text">
          <strong id="brand-title">施設管理データ<br>標準化スタジオ</strong>
          <small id="brand-subtitle">DATA STANDARD STUDIO</small>
        </div>
      </div>

      <div class="nav-group">
        <div class="nav-group-label">メインメニュー</div>
        <nav id="main-nav">
          <button type="button" class="nav-btn active" data-view="overview">
            <span class="nav-icon" aria-hidden="true">⊞</span>
            <span>全体ダッシュボード</span>
          </button>
          <button type="button" class="nav-btn" data-view="relations">
            <span class="nav-icon" aria-hidden="true">◈</span>
            <span>全体関連図・クラス図</span>
          </button>
          <button type="button" class="nav-btn" data-view="explorer">
            <span class="nav-icon" aria-hidden="true">▤</span>
            <span>領域・項目定義ブラウザ</span>
          </button>
          <button type="button" class="nav-btn" data-view="builder">
            <span class="nav-icon" aria-hidden="true">⇩</span>
            <span>CSVフォーマット作成</span>
          </button>
          <button type="button" class="nav-btn" data-view="codes">
            <span class="nav-icon" aria-hidden="true">⌗</span>
            <span>統制語彙・コード辞書</span>
          </button>
        </nav>
      </div>

      <div class="nav-group nav-domains-wrap">
        <div class="nav-group-label" id="sidebar-domain-heading">業務領域から開く</div>
        <div id="domain-nav" class="domain-nav-list"></div>
      </div>

      <div class="sidebar-footer">
        <div class="status-badge">
          <span class="status-dot" aria-hidden="true"></span>
          <span>完全ローカル動作（外部通信なし）</span>
        </div>
        <small>正本CSV同梱 · v<span id="sidebar-version">2.0</span></small>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div class="topbar-left">
          <div class="breadcrumb" id="breadcrumb">
            <span>標準化スタジオ</span>
            <span class="sep">/</span>
            <strong>全体ダッシュボード</strong>
          </div>
        </div>

        <div class="global-search-box" id="global-search-wrap">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input
            type="search"
            id="global-search-input"
            placeholder="項目名・別名・同義語・コード値を横断検索（Ctrl+K / /）"
            autocomplete="off"
            aria-label="全項目・同義語・コード横断検索"
          >
          <kbd class="search-kbd" id="search-kbd-hint">/</kbd>
          <div class="search-dropdown hidden" id="global-search-results" role="listbox" aria-label="検索候補"></div>
        </div>

        <div class="topbar-right">
          <span class="spec-pill" id="topbar-spec-pill">データモデル読込中</span>
        </div>
      </header>

      <main id="app-main" class="main-content" tabindex="-1">
        <div class="loading-state">データモデルを読み込んでいます…</div>
      </main>

      <footer class="app-footer">
        <div id="footer-left">施設管理データ標準化スタジオ v2.0</div>
        <div id="footer-right">ブラウザ内完結・外部送信なし</div>
      </footer>
    </div>
  </div>

  <!-- 項目詳細ドロワー -->
  <div id="drawer-backdrop" class="drawer-backdrop hidden" aria-hidden="true"></div>
  <aside id="detail-drawer" class="detail-drawer hidden" aria-label="項目詳細パネル" aria-modal="true" role="dialog">
    <div id="drawer-content" class="drawer-inner"></div>
  </aside>

  <!-- 統制語彙・コードリスト クイックポップアップ -->
  <div id="code-modal-backdrop" class="code-modal-backdrop hidden" aria-hidden="true"></div>
  <div id="code-modal" class="code-modal hidden" role="dialog" aria-modal="true" aria-label="統制語彙・コードリスト表示">
    <div id="code-modal-content" class="code-modal-inner"></div>
  </div>

  <!-- 共通クラス クイックポップアップ -->
  <div id="class-modal-backdrop" class="code-modal-backdrop hidden" aria-hidden="true"></div>
  <div id="class-modal" class="code-modal hidden" role="dialog" aria-modal="true" aria-label="共通クラス定義表示">
    <div id="class-modal-content" class="code-modal-inner"></div>
  </div>

  <!-- コピー通知トースト -->
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
</body>
</html>
